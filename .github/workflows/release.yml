name: release
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch: null
permissions: {}

env:
  PACKAGES: |
    packages/*

jobs:
  pr:
    if: |
      github.repository_owner == 'vite-pwa'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: danielroe/uppt/pr@6c1a9b480b0f02a3f535dedaf1a113f590aa56f2 # v0.6.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ env.PACKAGES }}
          pr-notes: |
            Try the latest `{base}` build with **pkg-pr-new**:

            - `pnpm add https://pkg.pr.new/@vite-pwa/workbox-build@{base}`
            - `pnpm add https://pkg.pr.new/@vite-pwa/workbox-cli@{base}`
            - `pnpm add https://pkg.pr.new/@vite-pwa/workbox-swkit@{base}`
            - `pnpm add https://pkg.pr.new/@vite-pwa/workbox-types@{base}`
            - `pnpm add https://pkg.pr.new/@vite-pwa/workbox-window@{base}`
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.repository_owner == 'vite-pwa'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: danielroe/uppt/release@6c1a9b480b0f02a3f535dedaf1a113f590aa56f2 # v0.6.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ env.PACKAGES }}
  pack:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - id: pack
        uses: danielroe/uppt/pack@6c1a9b480b0f02a3f535dedaf1a113f590aa56f2 # v0.6.12
        with:
          packages: ${{ env.PACKAGES }}
  publish:
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: danielroe/uppt/publish@6c1a9b480b0f02a3f535dedaf1a113f590aa56f2 # v0.6.12
        with:
          files: ${{ needs.pack.outputs.files }}
    environment: npm
