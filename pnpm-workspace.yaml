autoInstallPeers: true

catalogMode: prefer

cleanupUnusedCatalogs: true

dedupePeers: true

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

verifyDepsBeforeRun: install

preferWorkspacePackages: true

shamefullyHoist: true

shellEmulator: true

strictPeerDependencies: false

trustPolicy: no-downgrade

packages:
  - examples/**
  - packages/*

overrides:
  '@types/node': 24.12.0
  chokidar: ^5.0.0
  rolldown: 1.1.2

patchedDependencies:
  dotenv-expand@13.0.0: patches/dotenv-expand@13.0.0.patch

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false

catalogs:
  build:
    tsdown: ^0.23.0
  docs:
    typedoc: ^0.28.19
  eslint:
    '@antfu/eslint-config': ^9.5.1
    eslint: ^10.10.0
    eslint-plugin-antfu: ^3.2.3
  rsbuild:
    '@rsbuild/core': ^2.0.7
  rspack:
    '@rspack/core': ^2.0.4
  test:
    '@vitest/ui': ^5.0.0
    vitest: ^5.0.0
  types:
    '@types/node': 24.12.0
    '@types/serialize-javascript': ^5.0.4
    '@types/trusted-types': ^2.0.7
    '@types/webpack': ^5.28.1
  typescript:
    typescript: ~6.0.3
  utils:
    '@antfu/ni': ^25.0.0
    '@arethetypeswrong/core': ^0.18.5
    '@clack/prompts': ^1.5.1
    '@jridgewell/remapping': ^2.3.5
    ansis: ^4.2.0
    bumpp: ^12.3.0
    cac: ^7.0.0
    consola: ^3.4.2
    dotenv-expand: 13.0.0
    idb: ^8.0.3
    magic-string: ^1.3.1
    magicast: ^0.5.2
    picocolors: ^1.1.1
    proper-tags: ^2.0.2
    publint: ^0.3.18
    rolldown: ^1.1.2
    "@rolldown/pluginutils": ^1.0.1
    serialize-javascript: ^7.0.5
    std-env: ^4.1.0
    taze: ^19.10.0
    tinyglobby: ^0.2.16
    unrun: ^0.3.1
    valibot: ^1.3.1
    verkit: ^0.3.0
  vite:
    vite: 8.1.0
  webpack5:
    webpack: 5.107.1

minimumReleaseAgeExclude:
  - vite@8.1.0
